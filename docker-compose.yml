# Moin_Julia – alle Dienste. Start: `docker compose up -d --build`
# Werte kommen aus der .env (Vorlage: .env.example).

name: moin-julia

x-app-env: &app-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-moin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}@db:5432/${POSTGRES_DB:-moin_julia}
  REDIS_URL: redis://redis:6379

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt in .env}
      POSTGRES_DB: ${POSTGRES_DB:-moin_julia}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: moin-julia-migrate:latest
    build:
      context: .
      target: migrate
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  bot:
    image: moin-julia-bot:latest
    build:
      context: .
      target: bot
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    stop_grace_period: 15s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  dashboard:
    image: moin-julia-dashboard:latest
    build:
      context: .
      target: dashboard
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    ports:
      - '${DASHBOARD_PORT:-3000}:3000'
    volumes:
      # Austausch mit dem Host für den Update-Knopf (Anfrage rein, Status/Log raus) – kein Docker-Zugriff
      - ./control:/control
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  db-data:
  redis-data:
